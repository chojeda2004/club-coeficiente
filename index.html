<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Coeficiente - Ranking Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gm-color: #fbbf24;
            --master-color: #06b6d4;
            --expert-color: #a855f7;
            --amateur-color: #10b981;
            --learner-color: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            background-attachment: fixed;
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Fondo Animado ── */
        .bg-elements { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .glow-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; animation: pulse 12s infinite alternate; }
        .orb-1 { width: 600px; height: 600px; background: #4f46e5; top: -150px; right: -150px; }
        .orb-2 { width: 500px; height: 500px; background: #0ea5e9; bottom: -150px; left: -150px; }
        .orb-3 { width: 400px; height: 400px; background: #d946ef; top: 30%; left: 20%; opacity: 0.15; }
        @keyframes pulse { 0% { transform: scale(1) translate(0,0); } 100% { transform: scale(1.3) translate(40px,40px); } }
        .grid-pattern { position: absolute; inset: 0; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0); background-size: 50px 50px; }

        .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }

        /* ── Animaciones de Entrada ── */
        @keyframes revealDown {
            from { opacity: 0; transform: translateY(-30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(40px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            70% { transform: scale(1.05) translateY(-5px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .anim-reveal-down { animation: revealDown 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .anim-reveal-up { animation: revealUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .anim-pop { animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

        /* ── Header ── */
        header { text-align: center; margin-bottom: 4rem; }
        .header-content {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        .header-content::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary), #d946ef);
        }
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 8vw, 4rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 6px;
            background: linear-gradient(to bottom, #fff 30%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 15px rgba(56,189,248,0.4));
        }
        .sub-title { 
            font-size: 1.2rem; 
            color: var(--accent-primary); 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 8px;
            opacity: 0.8;
        }

        /* ── Podio Top 3 Animado ── */
        .podium-section { margin-bottom: 4rem; perspective: 1000px; }
        .podium-title {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--accent-secondary);
            margin-bottom: 2.5rem;
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .podium-title::before, .podium-title::after { content: ''; height: 1px; width: 50px; background: rgba(129,140,248,0.3); }

        .podium-wrap {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 1.5rem;
            min-height: 380px;
        }

        .podium-slot { 
            display: flex; flex-direction: column; align-items: center; 
            flex: 1; max-width: 240px; 
            opacity: 0; 
        }
        
        .podium-card {
            width: 100%;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 2rem 1rem 1.5rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .podium-card:hover { transform: translateY(-10px) scale(1.02); background: rgba(30, 41, 59, 0.8); }

        .podium-1 .podium-card { 
            border-color: rgba(251,191,36,0.4); 
            box-shadow: 0 0 40px rgba(251,191,36,0.15);
            background: linear-gradient(180deg, rgba(251,191,36,0.1) 0%, rgba(30, 41, 59, 0.5) 100%);
        }
        .podium-2 .podium-card { border-color: rgba(148,163,184,0.3); }
        .podium-3 .podium-card { border-color: rgba(180,83,9,0.3); }

        .podium-crown {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 12px rgba(251,191,36,0.6));
            animation: floatCrown 3s ease-in-out infinite;
        }
        @keyframes floatCrown { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-10px) rotate(5deg); } }
        .podium-2 .podium-crown, .podium-3 .podium-crown { animation: floatCrown 4s ease-in-out infinite reverse; font-size: 1.8rem; }

        .podium-avatar {
            width: 80px; height: 80px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; margin: 0 auto 1rem;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            transition: transform 0.3s ease;
        }
        .podium-card:hover .podium-avatar { transform: rotate(5deg) scale(1.1); }

        .podium-1 .podium-avatar { width: 100px; height: 100px; font-size: 4rem; border-color: var(--gm-color); }

        .podium-name {
            font-size: 1.2rem; font-weight: 700; color: #fff;
            margin-bottom: 0.5rem;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .podium-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem; font-weight: 900;
            color: var(--accent-primary);
            text-shadow: 0 0 10px rgba(56,189,248,0.3);
        }
        .podium-1 .podium-score { color: var(--gm-color); font-size: 2.5rem; }

        .podium-stats {
            margin-top: 1rem;
            display: flex; flex-direction: column; gap: 5px;
            font-size: 0.8rem; color: var(--text-muted);
        }
        .stat-row { display: flex; justify-content: center; gap: 10px; align-items: center; }
        .podium-winrate-box {
            background: rgba(16,185,129,0.15);
            color: #10b981;
            padding: 2px 10px; border-radius: 12px;
            font-weight: 700; border: 1px solid rgba(16,185,129,0.2);
        }

        .podium-base {
            width: 100%;
            margin-top: 1rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900; font-size: 1.8rem;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
        }
        .podium-1 .podium-base { height: 80px; background: linear-gradient(180deg, rgba(251,191,36,0.2), transparent); color: var(--gm-color); border-color: rgba(251,191,36,0.3); }
        .podium-2 .podium-base { height: 55px; color: #cbd5e1; }
        .podium-3 .podium-base { height: 40px; color: #d97706; }

        /* ── Ranking List ── */
        .tier-section { margin-bottom: 3rem; }
        .tier-header {
            display: flex; align-items: center; gap: 1rem;
            margin-bottom: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 3px;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .tier-grandmaster .tier-header { color: var(--gm-color); }
        .tier-master .tier-header { color: var(--master-color); }
        .tier-expert .tier-header { color: var(--expert-color); }
        .tier-amateur .tier-header { color: var(--amateur-color); }
        .tier-learner .tier-header { color: var(--learner-color); }

        .players-grid { display: flex; flex-direction: column; gap: 1rem; }

        .player-card {
            display: grid;
            grid-template-columns: 50px 60px 1fr auto;
            align-items: center;
            gap: 1.5rem;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .player-card:hover { 
            transform: translateX(10px); 
            background: rgba(51,65,85,0.6); 
            border-color: rgba(56,189,248,0.3);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .player-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--text-muted); opacity: 0.5;
        }
        .tier-grandmaster .player-card::before { background: var(--gm-color); box-shadow: 0 0 15px var(--gm-color); opacity: 1; }
        .tier-master .player-card::before { background: var(--master-color); opacity: 1; }
        .tier-expert .player-card::before { background: var(--expert-color); opacity: 1; }
        .tier-amateur .player-card::before { background: var(--amateur-color); opacity: 1; }

        .rank-num { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--text-muted); text-align: center; }
        .avatar {
            width: 54px; height: 54px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 2.2rem; background: rgba(255,255,255,0.03);
        }

        .pinfo .pname { font-size: 1.2rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
        .pmeta { display: flex; align-items: center; gap: 1rem; margin-top: 4px; flex-wrap: wrap; }
        .pelo { color: var(--accent-primary); font-weight: 600; font-size: 0.85rem; }
        
        .stat-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 2px 10px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-wr { color: #10b981; background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.2); }
        .stat-gs { color: var(--accent-secondary); background: rgba(129,140,248,0.1); border-color: rgba(129,140,248,0.2); }

        .score-wrap { text-align: right; }
        .score-wrap .pts {
            font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .score-wrap .lbl { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }

        /* ── Utilidades ── */
        .search-container {
            margin-bottom: 2rem;
            display: flex; justify-content: center;
        }
        .search-box {
            position: relative; width: 100%; max-width: 500px;
        }
        .search-box input {
            width: 100%; background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px; padding: 12px 25px;
            color: #fff; font-family: inherit; font-size: 1rem;
            transition: all 0.3s ease; outline: none;
        }
        .search-box input:focus { border-color: var(--accent-primary); box-shadow: 0 0 15px rgba(56,189,248,0.2); }

        .refresh-btn {
            background: none; border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted); padding: 8px 16px; border-radius: 20px;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: all 0.3s ease; font-family: inherit; font-size: 0.85rem;
            margin: 0 auto 2rem;
        }
        .refresh-btn:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.2); }
        .spinning svg { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ── Admin Panel ── */
        .admin-btn { position: fixed; bottom: 20px; right: 20px; opacity: 0.5; cursor: pointer; font-size: 24px; z-index: 100; transition: opacity 0.3s; }
        .admin-btn:hover { opacity: 1; }
        .admin-panel {
            background: #1e293b; border-radius: 20px; padding: 2rem;
            margin-top: 3rem; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .admin-table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; color: #fff; }
        .admin-table th, .admin-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .admin-input { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 5px 10px; border-radius: 5px; width: 100%; }
        .admin-actions { display: flex; gap: 10px; margin-top: 2rem; }
        .btn-primary { background: var(--accent-primary); color: #000; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 700; }
        .btn-danger { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }

        @media (max-width: 768px) {
            .podium-wrap { flex-direction: column; align-items: center; min-height: auto; gap: 1rem; }
            .podium-slot { width: 100%; max-width: 300px; order: unset !important; }
            .podium-base { height: 40px !important; font-size: 1.2rem; }
            .player-card { grid-template-columns: 40px 50px 1fr; gap: 1rem; }
            .score-wrap { grid-column: 1 / -1; text-align: left; display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
            .score-wrap .pts { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-elements">
        <div class="grid-pattern"></div>
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="wrap">
        <header class="anim-reveal-down">
            <div class="header-content">
                <h1 class="main-title">CLUB COEFICIENTE</h1>
                <p class="sub-title">RANKING OFICIAL</p>
            </div>
        </header>

        <div class="search-container anim-reveal-up" style="animation-delay: 0.2s">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar jugador..." oninput="onSearch()">
            </div>
        </div>

        <button id="refreshBtn" class="refresh-btn anim-reveal-up" style="animation-delay: 0.3s" onclick="refreshRanking()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path></svg>
            Actualizar Ranking
        </button>

        <div id="podiumRoot"></div>
        <div id="rankingRoot"></div>

        <!-- Panel de Administración -->
        <div id="adminPanel" style="display:none;" class="admin-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h3 style="font-family:'Orbitron';">Panel de Administración</h3>
                <button onclick="closeAdmin()" class="btn-secondary">Cerrar</button>
            </div>
            
            <div id="adminContent">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Usuario Lichess</th>
                            <th>Puntos Club</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
                
                <div style="background:rgba(0,0,0,0.2); padding:1.5rem; border-radius:15px;">
                    <h4 style="margin-bottom:1rem;">Añadir Nuevo Jugador</h4>
                    <div style="display:grid; grid-template-columns: 1fr 1fr auto; gap:10px;">
                        <input type="text" id="newUsername" placeholder="Usuario Lichess" class="admin-input">
                        <input type="number" id="newScore" placeholder="Puntos Iniciales" class="admin-input">
                        <button onclick="addPlayer()" class="btn-primary">Añadir</button>
                    </div>
                </div>

                <div class="admin-actions">
                    <button id="saveBtn" onclick="syncWithSheet()" class="btn-primary" style="width:100%; padding:15px; font-size:1.1rem;">
                        💾 GUARDAR CAMBIOS EN LA NUBE
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="admin-btn" onclick="checkAdmin()">⚙️</div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbydXprmWOwO_RjLcFubXdkxkPJmgVv73UJ-BjySMzOAwrzTaTm47-iu-zPZAZv0pQ6uAw/exec';
        const DEFAULT_PIECE = '♟';
        
        let players = [];
        let firstLoad = true;
        const lichessCache = {};

        const TIERS = [
            { name: 'Gran Maestro', cls: 'tier-grandmaster', icon: '👑', min: 150 },
            { name: 'Maestro',      cls: 'tier-master',      icon: '⭐', min: 96  },
            { name: 'Experto',      cls: 'tier-expert',      icon: '🔥', min: 75  },
            { name: 'Amateur',      cls: 'tier-amateur',     icon: '⚡', min: 55  },
            { name: 'Principiante', cls: 'tier-learner',     icon: '🔰', min: 0   }
        ];

        async function fetchLichessData(username) {
            const key = username.toLowerCase();
            if (lichessCache[key]) return lichessCache[key];
            try {
                const res = await fetch(`https://lichess.org/api/user/${username}`);
                if (!res.ok) return null;
                const data = await res.json();
                const perfs = data.perfs || {};
                const elo = perfs.rapid?.rating || perfs.blitz?.rating || perfs.bullet?.rating || 0;
                const result = {
                    elo,
                    country: data.profile?.country?.toLowerCase() || '',
                    games: data.count?.all || 0,
                    winrate: data.count?.all > 0 ? Math.round((data.count.win / data.count.all) * 100) : 0
                };
                lichessCache[key] = result;
                return result;
            } catch(e) { return null; }
        }

        async function load() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                players = data.map(p => ({
                    ...p,
                    username: p.username || p.usuario || '', // Manejar diferentes nombres de columna
                    score: Number(p.score || p.puntos) || 0,
                    elo: Number(p.elo) || 0
                })).filter(p => p.username);
                
                render();
                
                // Cargar stats extendidas en segundo plano
                for (let p of players) {
                    const lData = await fetchLichessData(p.username);
                    if (lData) {
                        p.elo = lData.elo;
                        p.country = lData.country;
                        p.games = lData.games;
                        p.winrate = lData.winrate;
                    }
                }
                render(); 
            } catch(e) { console.error("Error cargando datos", e); }
        }

        function renderPodium(sorted) {
            const root = document.getElementById('podiumRoot');
            if (sorted.length < 3) { root.innerHTML = ''; return; }

            const top = sorted.slice(0, 3);
            const visualOrder = [top[1], top[0], top[2]];
            const crowns = ['👑', '🥈', '🥉'];
            
            let html = `
                <div class="podium-section">
                    <p class="podium-title">PODIO DE HONOR</p>
                    <div class="podium-wrap">
            `;

            visualOrder.forEach((p, i) => {
                const realPos = sorted.indexOf(p); 
                const cls = `podium-${realPos + 1}`;
                const crown = crowns[realPos];
                const flag = p.country ? `<img src="https://flagcdn.com/w20/${p.country}.png" alt="flag">` : '';
                
                html += `
                    <div class="podium-slot ${cls}" id="podium-slot-${realPos}" style="opacity:0;">
                        <div class="podium-card">
                            <span class="podium-crown">${crown}</span>
                            <div class="podium-avatar">${p.piece || DEFAULT_PIECE}</div>
                            <div class="podium-name">${flag} ${p.username}</div>
                            <div class="podium-score">${p.score}</div>
                            <div class="podium-stats">
                                <div class="stat-row">
                                    <span>ELO ${p.elo || '---'}</span>
                                    ${p.winrate ? `<span class="podium-winrate-box">${p.winrate}% WR</span>` : ''}
                                </div>
                                ${p.games ? `<div style="opacity:0.7">${p.games.toLocaleString()} partidas</div>` : ''}
                            </div>
                        </div>
                        <div class="podium-base">${realPos + 1}</div>
                    </div>
                `;
            });

            html += `</div></div>`;
            root.innerHTML = html;

            setTimeout(() => {
                [1, 0, 2].forEach((idx, i) => { 
                    const el = document.getElementById(`podium-slot-${idx}`);
                    if (el) {
                        setTimeout(() => {
                            el.style.opacity = '1';
                            el.classList.add('anim-pop');
                        }, i * 200);
                    }
                });
            }, 100);
        }

        function render() {
            const sorted = [...players].sort((a, b) => b.score - a.score);
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = sorted.filter(p => p.username.toLowerCase().includes(query));

            if (!query) renderPodium(sorted);
            else document.getElementById('podiumRoot').innerHTML = '';

            const root = document.getElementById('rankingRoot');
            let html = '';

            TIERS.forEach(tier => {
                const tierPlayers = filtered.filter(p => {
                    // Encontrar a qué tier pertenece el jugador basado en su score
                    const playerTier = TIERS.find(t => p.score >= t.min);
                    return playerTier && playerTier.name === tier.name;
                });

                if (tierPlayers.length > 0) {
                    html += `
                        <div class="tier-section ${tier.cls} anim-reveal-up">
                            <div class="tier-header">${tier.icon} ${tier.name}</div>
                            <div class="players-grid">
                    `;

                    tierPlayers.forEach(p => {
                        const pos = sorted.indexOf(p) + 1;
                        const flag = p.country ? `<img src="https://flagcdn.com/w20/${p.country}.png" alt="flag">` : '';
                        html += `
                            <div class="player-card">
                                <div class="rank-num">${pos}</div>
                                <div class="avatar">${p.piece || DEFAULT_PIECE}</div>
                                <div class="pinfo">
                                    <div class="pname">${flag} ${p.username}</div>
                                    <div class="pmeta">
                                        <span class="pelo">ELO ${p.elo || '---'}</span>
                                        ${p.winrate ? `<span class="stat-badge stat-wr">⚡ ${p.winrate}% WR</span>` : ''}
                                        ${p.games ? `<span class="stat-badge stat-gs">♟ ${p.games.toLocaleString()} partidas</span>` : ''}
                                        <a href="https://lichess.org/@/${p.username}" target="_blank" style="color:var(--accent-secondary); font-size:0.8rem; text-decoration:none;">Perfil</a>
                                    </div>
                                </div>
                                <div class="score-wrap">
                                    <div class="pts">${p.score}</div>
                                    <div class="lbl">PTS CLUB</div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                }
            });

            root.innerHTML = html;
        }

        function onSearch() { render(); }

        async function refreshRanking() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            await load();
            btn.classList.remove('spinning');
        }

        // ── Funciones de Administración ──

        function checkAdmin() {
            const pass = prompt("Contraseña de administrador:");
            if (pass === '73777127') {
                document.getElementById('adminPanel').style.display = 'block';
                renderAdmin();
                document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth' });
            } else if (pass !== null) {
                alert("Contraseña incorrecta");
            }
        }

        function closeAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        function renderAdmin() {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';
            
            players.forEach((p, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.username}</td>
                    <td>
                        <input type="number" value="${p.score}" 
                               onchange="updatePlayerScore(${index}, this.value)" 
                               class="admin-input" style="width:80px">
                    </td>
                    <td>
                        <button onclick="removePlayer(${index})" class="btn-danger">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updatePlayerScore(index, value) {
            players[index].score = Number(value);
            render(); // Actualizar ranking visualmente
        }

        function addPlayer() {
            const user = document.getElementById('newUsername').value.trim();
            const score = Number(document.getElementById('newScore').value) || 0;
            
            if (!user) return alert("Ingresa un usuario");
            if (players.find(p => p.username.toLowerCase() === user.toLowerCase())) {
                return alert("El jugador ya existe");
            }
            
            players.push({ username: user, score: score });
            document.getElementById('newUsername').value = '';
            document.getElementById('newScore').value = '';
            
            render();
            renderAdmin();
        }

        function removePlayer(index) {
            if (confirm(`¿Eliminar a ${players[index].username}?`)) {
                players.splice(index, 1);
                render();
                renderAdmin();
            }
        }

        async function syncWithSheet() {
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerText;
            btn.innerText = "⏳ GUARDANDO...";
            btn.disabled = true;

            try {
                // Preparar datos para enviar (solo username y score)
                const dataToSave = players.map(p => ({
                    username: p.username,
                    score: p.score
                }));

                const response = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Google Apps Script suele requerir no-cors para POST simples
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSave)
                });

                alert("Cambios enviados. Nota: Si la hoja no se actualiza, verifica los permisos del script de Google.");
            } catch (e) {
                console.error(e);
                alert("Error al sincronizar: " + e.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // Inicializar
        load();
    </script>
</body>
</html>
