<body>
<div class="bg-elements"><div class="grid-pattern"></div></div>

<div class="wrap">

    <div class="action-bar">

                <input type="text" id="lichessLinkInput" placeholder="https://lichess.org/@/NombreJugador  —  o solo el nombre de usuario" />

                </select>

        <button onclick="bulkRefreshStats()" id="bulkRefreshBtn" style="width:100%; padding:20px; background:#ffae00; border:none; font-family:'Orbitron'; font-weight:900; font-size:1.5rem; cursor:pointer; margin-bottom:2rem; border-radius:15px;">⚡ SINCRONIZACIÓN TOTAL ⚡</button>

        <table style="width:100%; color:#fff; border-collapse:collapse;">
            <thead><tr style="border-bottom:3px solid #ff4d00; text-align:left;">
                <th style="padding:15px;">JUGADOR</th><th>ELO</th><th>WR</th><th>PARTIDAS</th><th>PIEZA</th><th>PTS</th><th>X</th>

            <button id="saveBtn" onclick="syncWithSheet()" style="flex:1; min-width:200px; padding:20px; background:#ff4d00; color:#000; font-family:'Orbitron'; font-weight:900; font-size:1.2rem; border:none; border-radius:15px; cursor:pointer;">💾 GUARDAR EN EL NÚCLEO</button>

</div>
<div class="admin-btn" onclick="checkAdmin()">⚙️</div>

<script>
// ════════════════════════════════════════════════════════
//  CONFIGURACIÓN
// ════════════════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbydXprmWOwO_RjLcFubXdkxkPJmgVv73UJ-BjySMzOAwrzTaTm47-iu-zPZAZv0pQ6uAw/exec';
const DEFAULT_PIECE = '♟';
const CHESS_PIECES  = ['♟','♞','♝','♜','♛','♚'];
const LICHESS_BASE  = 'https://corsproxy.io/?url=https://lichess.org/api/user/';
const LICHESS_MODES = [
    'rapid','blitz','bullet','classical','correspondence',
    'ultraBullet','chess960','crazyhouse','antichess',
    'atomic','horde','kingOfTheHill','racingKings','threeCheck'
];

let players = [];
const lichessCache = {};
let pendingFetchedPlayer = null;

const TIERS = [
    { name:'Gran Maestro', icon:'👑', min:150 },
    { name:'Maestro',      icon:'⭐', min:96  },
    { name:'Experto',      icon:'🔥', min:75  },
    { name:'Amateur',      icon:'⚡', min:55  },
    { name:'Principiante', icon:'🔰', min:0   }
];
const TIER_CLASS = {
    'Gran Maestro':'card-gran-maestro',
    'Maestro':'card-maestro',
    'Experto':'card-experto',
    'Amateur':'card-amateur',
    'Principiante':''
};

// ════════════════════════════════════════════════════════
//  LICHESS
// ════════════════════════════════════════════════════════
function parseLichessUser(data) {
    const perfs = data.perfs || {};
    let elo = 0, bestGames = 0;
    for (const mode of LICHESS_MODES) {
        const perf = perfs[mode];
        if (perf && typeof perf.games === 'number' && perf.games > bestGames) {
            bestGames = perf.games;
            elo = perf.rating || 0;
        }
    }
    if (!elo) {
        for (const mode of LICHESS_MODES) {
            if (perfs[mode]?.rating) { elo = perfs[mode].rating; break; }
        }
    }
    const total  = data.count?.all  || 0;
    const wins   = data.count?.win  || 0;
    const losses = data.count?.loss || 0;
    const draws  = data.count?.draw || 0;
    return {
        elo,
        country  : data.profile?.country?.toLowerCase() || '',
        winrate  : total > 0 ? Math.round((wins / total) * 100) : 0,
        total, wins, losses, draws,
        notFound : false, disabled: false
    };
}

async function lichessFetch(username) {
    const urls = [
        `https://lichess.org/api/user/${username}`,
        `${LICHESS_BASE}${username}`
    ];
    for (const url of urls) {
        try {
            const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
            if (res.status === 404) return { status: 404 };
            if (res.status === 200) return { status: 200, data: await res.json() };
        } catch(e) { continue; }
    }
    return { status: 0 };
}

async function fetchLichessOne(username) {
    const key = username.toLowerCase();
    const result = await lichessFetch(username);
    if (result.status === 404) {
        lichessCache[key] = { elo:0,winrate:0,total:0,wins:0,losses:0,draws:0,country:'',notFound:true,disabled:false };
        return;
    }
    if (result.status === 0) { console.warn(`[Lichess] Sin respuesta para ${username}`); return; }
    const data = result.data;
    if (data.disabled || data.tosViolation) {
        lichessCache[key] = { elo:0,winrate:0,total:0,wins:0,losses:0,draws:0,country:'',notFound:false,disabled:true };
        return;
    }
    lichessCache[key] = parseLichessUser(data);
}

async function fetchLichessBatch(usernames) {
    if (!usernames.length) return;
    await Promise.all(usernames.map(u => fetchLichessOne(u)));
}

function applyLichessCache() {
    players.forEach(p => {
        const d = lichessCache[p.username.toLowerCase()];
        if (d) Object.assign(p, d);
    });
}

function getStatsLabel(p) {
    if (p.notFound)         return '⚠️ Usuario no encontrado en Lichess';
    if (p.disabled)         return '🚫 Cuenta suspendida en Lichess';
    if (!p.elo && !p.total) return 'Sin datos de Lichess aún';
    return `ELO ${p.elo || '---'} | ${p.winrate || 0}% WR | ${(p.total || 0).toLocaleString()} partidas`;
}

// ════════════════════════════════════════════════════════
//  FETCH FROM LINK
// ════════════════════════════════════════════════════════
function extractUsername(input) {
    input = input.trim();
    const m = input.match(/lichess\.org\/@?\/?([\w-]+)/i)
           || input.match(/^@\/?([^/\s]+)/)
           || (input.match(/^[\w-]+$/) ? [null, input] : null);
    return m ? m[1] : null;
}

async function fetchFromLink() {
    const input   = document.getElementById('lichessLinkInput').value;
    const errorEl = document.getElementById('fetchError');
    const preview = document.getElementById('previewCard');
    const btn     = document.getElementById('fetchBtn');

    errorEl.classList.remove('visible');
    preview.classList.remove('visible');
    pendingFetchedPlayer = null;

    const username = extractUsername(input);
    if (!username) {
        errorEl.textContent = 'Link inválido. Pega el link del perfil o solo el nombre de usuario.';
        errorEl.classList.add('visible');
        return;
    }

    btn.disabled = true; btn.textContent = '...';

    try {
        const result = await lichessFetch(username);
        if (result.status === 404) {
            errorEl.textContent = 'Usuario no encontrado en Lichess.';
            errorEl.classList.add('visible'); return;
        }
        if (result.status === 0) {
            errorEl.textContent = 'No se pudo conectar con Lichess. Revisa tu internet.';
            errorEl.classList.add('visible'); return;
        }
        const data = result.data;
        if (data.disabled || data.tosViolation) {
            errorEl.textContent = 'Esta cuenta está suspendida en Lichess.';
            errorEl.classList.add('visible'); return;
        }

        const parsed = parseLichessUser(data);
        pendingFetchedPlayer = { username: data.username, ...parsed };

        const perfs = data.perfs || {};
        document.getElementById('previewAvatar').textContent = DEFAULT_PIECE;
        document.getElementById('previewName').textContent   = data.username;
        document.getElementById('previewStats').textContent  =
            `ELO ${parsed.elo || '---'} | WR ${parsed.winrate}% | Rapid ${perfs.rapid?.rating || '---'} Blitz ${perfs.blitz?.rating || '---'} Bullet ${perfs.bullet?.rating || '---'}`;
        document.getElementById('previewGames').textContent  =
            `${parsed.total.toLocaleString()} partidas — ${parsed.wins}G / ${parsed.draws}T / ${parsed.losses}P`;
        document.getElementById('previewScore').value = 0;
        preview.classList.add('visible');
        document.getElementById('lichessLinkInput').value = '';
    } catch(e) {
        errorEl.textContent = 'Error inesperado. Intenta de nuevo.';
        errorEl.classList.add('visible');
        console.error(e);
    } finally {
        btn.disabled = false; btn.textContent = 'BUSCAR';
    }
}

// Al añadir jugador: guarda automáticamente en el Sheet
async function confirmAddFromLink() {
    if (!pendingFetchedPlayer) return;
    const piece = document.getElementById('previewPiece').value;
    const score = Number(document.getElementById('previewScore').value) || 0;
    if (players.find(p => p.username.toLowerCase() === pendingFetchedPlayer.username.toLowerCase())) {
        alert('Este jugador ya está en el ranking.'); return;
    }
    players.push({ ...pendingFetchedPlayer, piece, score });
    lichessCache[pendingFetchedPlayer.username.toLowerCase()] = { ...pendingFetchedPlayer };
    document.getElementById('previewCard').classList.remove('visible');
    pendingFetchedPlayer = null;
    render(); renderAdmin();

// ════════════════════════════════════════════════════════
//  FIRE BORDER
// ════════════════════════════════════════════════════════
let fireAnimId = null;
function startFireBorder(canvas) {
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() { W = canvas.offsetWidth; H = canvas.offsetHeight; canvas.width = W; canvas.height = H; }
    resize();
    const ro = new ResizeObserver(resize); ro.observe(canvas.parentElement);
    const BORDER = 18, COUNT = 220;
    function perimeterPoint(t) {
        const r=20,top=W-2*r,right=H-2*r,bottom=W-2*r,left=H-2*r,arcs=Math.PI*r,total=2*(top+right)+4*arcs;
        let d=t*total;
        if(d<top)return{x:r+d,y:0};d-=top;
        if(d<arcs){const a=-Math.PI/2+(d/arcs)*(Math.PI/2);return{x:W-r+Math.cos(a)*r,y:r+Math.sin(a)*r};}d-=arcs;
        if(d<right)return{x:W,y:r+d};d-=right;
        if(d<arcs){const a=(d/arcs)*(Math.PI/2);return{x:W-r+Math.cos(a)*r,y:H-r+Math.sin(a)*r};}d-=arcs;
        if(d<bottom)return{x:W-r-d,y:H};d-=bottom;
        if(d<arcs){const a=Math.PI/2+(d/arcs)*(Math.PI/2);return{x:r+Math.cos(a)*r,y:H-r+Math.sin(a)*r};}d-=arcs;
        if(d<left)return{x:0,y:H-r-d};d-=left;
        const a=Math.PI+(d/arcs)*(Math.PI/2);return{x:r+Math.cos(a)*r,y:r+Math.sin(a)*r};
    }
    function perimeterNormal(t){
        const eps=0.002,a=perimeterPoint((t-eps+1)%1),b=perimeterPoint((t+eps)%1);
        const dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1;
        return{nx:dy/len,ny:-dx/len};
    }
    class Particle {
        constructor(){this.reset(true);}
        reset(rand){
            this.t=rand?Math.random():this.t;this.speed=0.0003+Math.random()*0.0004;
            const pt=perimeterPoint(this.t),nm=perimeterNormal(this.t);
            this.x=pt.x+nm.nx*(Math.random()*BORDER*0.4);this.y=pt.y+nm.ny*(Math.random()*BORDER*0.4);
            this.vx=nm.nx*(0.3+Math.random()*0.7);this.vy=nm.ny*(0.3+Math.random()*0.7)-0.8;
            this.life=0;this.maxLife=35+Math.random()*45;this.size=3+Math.random()*6;this.hue=20+Math.random()*30;
        }
        update(){
            this.t=(this.t+this.speed)%1;
            const pt=perimeterPoint(this.t),nm=perimeterNormal(this.t);
            this.x=pt.x+nm.nx*3+this.vx*(this.life*0.4);this.y=pt.y+nm.ny*3+this.vy*(this.life*0.4);
            this.vy-=0.04;this.vx+=(Math.random()-0.5)*0.05;this.life++;
            if(this.life>this.maxLife)this.reset(false);
        }
        draw(ctx){
            const p=this.life/this.maxLife,alpha=p<0.2?p/0.2:1-(p-0.2)/0.8,size=this.size*(1-p*0.4);
            const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,size*2.5);
            g.addColorStop(0,`hsla(${this.hue+20},100%,90%,${alpha})`);
            g.addColorStop(0.3,`hsla(${this.hue},100%,60%,${alpha*0.9})`);
            g.addColorStop(0.7,`hsla(${this.hue-15},100%,40%,${alpha*0.6})`);
            g.addColorStop(1,`hsla(${this.hue-20},100%,20%,0)`);
            ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,size,0,Math.PI*2);ctx.fill();
        }
    }
    const particles=Array.from({length:COUNT},()=>new Particle());
    function frame(){
        ctx.clearRect(0,0,W,H);
        ctx.save();ctx.shadowColor='#ff6000';ctx.shadowBlur=18;ctx.strokeStyle='rgba(255,120,0,0.25)';ctx.lineWidth=BORDER;
        ctx.beginPath();ctx.roundRect(BORDER/2,BORDER/2,W-BORDER,H-BORDER,22);ctx.stroke();ctx.restore();
        particles.forEach(p=>{p.update();p.draw(ctx);});
        fireAnimId=requestAnimationFrame(frame);
    }
    if(fireAnimId)cancelAnimationFrame(fireAnimId);
    fireAnimId=requestAnimationFrame(frame);
}

// ════════════════════════════════════════════════════════
//  CARGAR DATOS
// ════════════════════════════════════════════════════════
async function load() {
    try {
        const res  = await fetch(API_URL + '?nocache=' + Date.now());
        const data = await res.json();
        players = data
            .map(p => ({
                ...p,
                username : p.username || p.usuario || '',
                score    : Number(p.score ?? p.puntos) || 0,
                piece    : p.piece || p.pieza || DEFAULT_PIECE,
                elo      : Number(p.elo) || 0,
                notFound : false,
                disabled : false
            }))
            .filter(p => p.username);
        render();
        await fetchLichessBatch(players.map(p => p.username));
        applyLichessCache();
        render();
    } catch(e) { console.error('[load]', e); }
}

// ════════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════════
function renderPodium(sorted) {
    const root=document.getElementById('podiumRoot');
    if(sorted.length<3){root.innerHTML='';return;}
    const top=sorted.slice(0,3),visualOrder=[top[1],top[0],top[2]],crowns=['🥈','👑','🥉'];
    let html=`<div class="podium-wrap">`;
    visualOrder.forEach((p,i)=>{
        const realPos=sorted.indexOf(p),crown=crowns[i],isFirst=realPos===0;
        const flag=p.country?`<img src="https://flagcdn.com/w20/${p.country}.png" alt="">`:'';
        html+=`<div class="podium-slot podium-${realPos+1}" id="podium-slot-${realPos}">
            ${isFirst?`<div class="fire-frame-wrap" id="fire-wrap">`:''}
            <div class="podium-card">
                <span style="font-size:3rem;display:block;margin-bottom:10px;">${crown}</span>
                <div class="avatar-mega">${p.piece||DEFAULT_PIECE}</div>
                <div style="font-size:1.4rem;font-weight:900;">${flag} ${p.username}</div>
                <div class="pts-mega" style="color:#ffae00;">${p.score}</div>
                <div style="color:#ff4d00;font-weight:700;margin-top:10px;">ELO ${p.elo||'---'}</div>
            </div>
            ${isFirst?`<canvas class="fire-canvas" id="fireCanvas"></canvas></div>`:''}
            <div style="font-family:'Orbitron';font-size:2rem;font-weight:900;margin-top:15px;color:#ff4d00;text-align:center;">#${realPos+1}</div>
        </div>`;
    });
    html+=`</div>`;root.innerHTML=html;
    requestAnimationFrame(()=>{const c=document.getElementById('fireCanvas');if(c)startFireBorder(c);});
    setTimeout(()=>{[1,0,2].forEach((idx,i)=>{const el=document.getElementById(`podium-slot-${idx}`);if(el)setTimeout(()=>{el.style.opacity='1';},i*200);});},100);
}

function render() {
    const sorted=[...players].sort((a,b)=>b.score-a.score);
    const query=document.getElementById('searchInput').value.toLowerCase();
    const filtered=sorted.filter(p=>p.username.toLowerCase().includes(query));
    if(!query)renderPodium(sorted);else document.getElementById('podiumRoot').innerHTML='';
    const root=document.getElementById('rankingRoot');
    let html='';
    TIERS.forEach(tier=>{
        const tp=filtered.filter(p=>{const pt=TIERS.find(t=>p.score>=t.min);return pt&&pt.name===tier.name;});
        if(!tp.length)return;
        const tierCss=TIER_CLASS[tier.name]||'';
        html+=`<div style="margin-bottom:2rem;"><div style="font-family:'Orbitron';font-size:1.5rem;color:#ff4d00;margin-bottom:1rem;border-left:5px solid #ff4d00;padding-left:10px;">${tier.icon} ${tier.name}</div>`;
        tp.forEach(p=>{
            const pos=sorted.indexOf(p)+1;
            const flag=p.country?`<img src="https://flagcdn.com/w20/${p.country}.png" alt="">`:'';
            html+=`<div class="player-card ${tierCss}">
                <div style="font-family:'Orbitron';font-size:1.8rem;font-weight:900;color:#444;">#${pos}</div>
                <div class="list-avatar">${p.piece||DEFAULT_PIECE}</div>
                <div style="position:relative;z-index:2;">
                    <div style="font-size:1.5rem;font-weight:900;">${flag} ${p.username}</div>
                    <div style="color:#ffae00;font-weight:700;">${getStatsLabel(p)}</div>
                </div>
                <div class="pts-mega">${p.score}</div>
            </div>`;
        });
        html+=`</div>`;
    });
    root.innerHTML=html;
}

        const eloDisplay   = p.notFound?'⚠️ N/E':p.disabled?'🚫 BAN':(p.elo||'—');

function updatePlayerScore(i,v){players[i].score=Number(v);render();}
function updatePlayerPiece(i,v){players[i].piece=v;render();}
function removePlayer(i){if(confirm("¿ELIMINAR?")){players.splice(i,1);render();renderAdmin();}}

async function bulkRefreshStats(){
    const btn=document.getElementById('bulkRefreshBtn');
    btn.innerText="⚡ SINCRONIZANDO...";btn.disabled=true;
    try{
        players.forEach(p=>delete lichessCache[p.username.toLowerCase()]);
        await fetchLichessBatch(players.map(p=>p.username));
        applyLichessCache();render();renderAdmin();
    }finally{btn.innerText="⚡ SINCRONIZACIÓN TOTAL ⚡";btn.disabled=false;}
}

// ════════════════════════════════════════════════════════
//  GUARDAR EN GOOGLE SHEET  ← FIX PRINCIPAL
//
//  Google Apps Script no acepta fetch() con mode:'no-cors'
//  porque necesita manejar la redirección 302.
//  Solución: enviar los datos como parámetro GET en la URL,
//  lo cual SÍ funciona con el doGet() del GAS.
//  El GAS debe leer e= del parámetro y guardar el JSON.
// ════════════════════════════════════════════════════════
async function syncWithSheet() {
    const btn      = document.getElementById('saveBtn');
    const statusEl = document.getElementById('saveStatus');

    // SEGURO: nunca guardar si la lista está vacía
    if (!players || players.length === 0) {
        statusEl.textContent = '⚠️ Lista vacía, no se guardó';
        statusEl.className   = 'save-status err';
        setTimeout(() => { statusEl.textContent = ''; }, 4000);
        return;
    }

    btn.innerText        = '⏳ GUARDANDO...';
    btn.disabled         = true;
    statusEl.textContent = '';
    statusEl.className   = 'save-status';

    const payload = players.map(p => ({
        username : p.username,
        score    : p.score,
        piece    : p.piece
    }));

    try {
        // POST con body JSON — sin límite de tamaño, funciona con GAS
        const res  = await fetch(API_URL, {
            method  : 'POST',
            headers : { 'Content-Type': 'text/plain' },
            body    : JSON.stringify(payload)
        });
        const text = await res.text();
        let   ok   = false;
        try { ok = JSON.parse(text)?.ok === true; } catch(_) { ok = text.includes('"ok":true'); }

        if (ok) {
            statusEl.textContent = '✅ GUARDADO (' + payload.length + ' jugadores)';
            statusEl.className   = 'save-status ok';
        } else {
            throw new Error(text.slice(0, 200));
        }
    } catch(e) {
        console.error('[syncWithSheet]', e);
        statusEl.textContent = '❌ ERROR: ' + e.message.slice(0, 80);
        statusEl.className   = 'save-status err';
    } finally {
        btn.innerText = '💾 GUARDAR EN EL NÚCLEO';
        btn.disabled  = false;
        setTimeout(() => { statusEl.textContent = ''; }, 5000);
    }
}
